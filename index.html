<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ModaStyle - Catalogo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .header .cart {
            background: #00b894;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .section-title {
            padding: 20px 20px 12px;
            font-size: 16px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Carousel */
        .carousel-container {
            padding: 0 0 0 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            display: flex;
            gap: 14px;
            padding-bottom: 20px;
            scrollbar-width: none;
        }
        .carousel-container::-webkit-scrollbar { display: none; }
        .card {
            scroll-snap-align: start;
            min-width: 260px;
            max-width: 260px;
            background: #16213e;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.97); }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-body {
            padding: 14px 16px;
        }
        .card-body h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-body .desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }
        .card-body .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-body .price {
            font-size: 18px;
            font-weight: 700;
            color: #00b894;
        }
        .card-body .old-price {
            font-size: 13px;
            color: #666;
            text-decoration: line-through;
            margin-left: 8px;
        }
        .btn-buy {
            background: #00b894;
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-buy:active { background: #00a383; }
        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 8px;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background: #00b894;
            border-color: #00b894;
        }
        .cat-btn:active { transform: scale(0.95); }
        /* Banner */
        .banner {
            margin: 16px 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            text-align: center;
        }
        .banner h2 { font-size: 18px; margin-bottom: 6px; }
        .banner p { font-size: 13px; opacity: 0.8; }
        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f0f23;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active { color: #00b894; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .spacer { height: 80px; }
        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00b894;
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ModaStyle</h1>
        <div class="cart" id="cartBtn">🛒 0 itens</div>
    </div>

    <div class="banner">
        <h2>🔥 MEGA SALE - Ate 60% OFF</h2>
        <p>Aproveite os melhores precos da temporada</p>
    </div>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCat('all')">Todos</button>
        <button class="cat-btn" onclick="filterCat('camisetas')">Camisetas</button>
        <button class="cat-btn" onclick="filterCat('jaquetas')">Jaquetas</button>
        <button class="cat-btn" onclick="filterCat('tenis')">Tenis</button>
        <button class="cat-btn" onclick="filterCat('acessorios')">Acessorios</button>
    </div>

    <p class="section-title">✨ Destaques</p>
    <div class="carousel-container" id="carousel1"></div>

    <p class="section-title">🆕 Novidades</p>
    <div class="carousel-container" id="carousel2"></div>

    <p class="section-title">💰 Ofertas</p>
    <div class="carousel-container" id="carousel3"></div>

    <div class="spacer"></div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
            <span>Buscar</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Favoritos</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span>Carrinho</span>
        </div>
    </div>

    <div class="toast" id="toast">✅ Adicionado ao carrinho!</div>

    <script>
        // Telegram WebApp integration
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const products = [
            {name:"Camiseta Premium", desc:"Algodao organico", price:"R$ 89,90", oldPrice:"R$ 129,90", img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400", cat:"camisetas"},
            {name:"Jaqueta Urban", desc:"Impermeavel, moderna", price:"R$ 249,90", oldPrice:"R$ 349,90", img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400", cat:"jaquetas"},
            {name:"Tenis Runner", desc:"Ultra leve", price:"R$ 399,90", oldPrice:"R$ 499,90", img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", cat:"tenis"},
            {name:"Camiseta Basica", desc:"100% algodao", price:"R$ 49,90", oldPrice:"R$ 79,90", img:"https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=400", cat:"camisetas"},
            {name:"Jaqueta Couro", desc:"Couro sintetico", price:"R$ 449,90", oldPrice:"R$ 599,90", img:"https://images.unsplash.com/photo-1520975954732-35dd22299614?w=400", cat:"jaquetas"},
            {name:"Tenis Casual", desc:"Dia a dia", price:"R$ 199,90", oldPrice:"R$ 279,90", img:"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=400", cat:"tenis"},
            {name:"Bone Snapback", desc:"Ajustavel", price:"R$ 69,90", oldPrice:"R$ 99,90", img:"https://images.unsplash.com/photo-1588850561407-ed78c334e67a?w=400", cat:"acessorios"},
            {name:"Mochila Tech", desc:"Compartimento notebook", price:"R$ 189,90", oldPrice:"R$ 259,90", img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400", cat:"acessorios"},
            {name:"Camiseta Estampada", desc:"Edicao limitada", price:"R$ 79,90", oldPrice:"R$ 119,90", img:"https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=400", cat:"camisetas"},
        ];

        let cartCount = 0;

        function createCard(p) {
            return `<div class="card">
                <img src="${p.img}" alt="${p.name}">
                <div class="card-body">
                    <h3>${p.name}</h3>
                    <p class="desc">${p.desc}</p>
                    <div class="price-row">
                        <div><span class="price">${p.price}</span><span class="old-price">${p.oldPrice}</span></div>
                        <button class="btn-buy" onclick="addToCart('${p.name}')">Comprar</button>
                    </div>
                </div>
            </div>`;
        }

        function renderCarousels(filter) {
            const filtered = filter === 'all' ? products : products.filter(p => p.cat === filter);
            const c1 = filtered.slice(0, 3);
            const c2 = filtered.slice(3, 6);
            const c3 = filtered.slice(6, 9);
            document.getElementById('carousel1').innerHTML = c1.map(createCard).join('');
            document.getElementById('carousel2').innerHTML = c2.map(createCard).join('');
            document.getElementById('carousel3').innerHTML = c3.map(createCard).join('');
        }

        function filterCat(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderCarousels(cat);
        }

        function addToCart(name) {
            cartCount++;
            document.getElementById('cartBtn').textContent = `🛒 ${cartCount} ${cartCount === 1 ? 'item' : 'itens'}`;
            const toast = document.getElementById('toast');
            toast.textContent = `✅ ${name} adicionado!`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
            // Haptic feedback
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        renderCarousels('all');
    </script>
</body>
</html>
